name: yundera
services:
  # =============================================================================
  # ADMIN GATE (AppShield) — the only public entrypoint to the dashboard.
  #
  #   admin      = this gate. Owns admin-${DOMAIN} and the login flow.
  #   admin-app  = settings-center-app itself (below). No public route.
  #
  # The dashboard used to be its own OIDC client. It is not any more: one system
  # (AppShield) fronts every platform app — Maison, store apps, this — so there is
  # one auth surface to review instead of one per app.
  #
  # NAMING IS LOAD-BEARING, exactly as in the maison stack: the auth-registrar derives
  # an app's client_id from a PTR lookup of the CALLER's container name on the pcs
  # network, and only ever issues redirect URIs under `<client_id>-<suffix>`. So
  # the gate must be the container named `admin`, and the app takes the suffixed
  # name. Swap them and the OIDC callback lands on a hostname the stack's routes
  # (template/stacks/yundera/routes) do not publish, and login dead-ends.
  # =============================================================================
  admin:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: admin
    hostname: admin
    restart: unless-stopped
    # The image's own default, written down HERE because something on the host has
    # to chown the gate-data bind below to match it, and an image repin must not
    # be able to silently move the target (ensure-user-compose-stack-up.sh chowns to
    # this exact uid). The maison and kopia gates pin "0:0" instead; this one stays
    # unprivileged — it needs to write nothing but its own session file.
    user: "65534:65534"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      # The gate's identity to the registrar AND the `aud` of every assertion it
      # signs. Explicit rather than relying on AppShield's hostname default,
      # because admin-app verifies this exact value.
      APP_NAME: "admin"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Pre-registration guess / fallback if /register is unreachable; the
      # registrar's own list is what actually decides (appshield >= 2.0.10,
      # mesh-auth >= 1.1.4). Both come from the box's routing domains (the mesh
      # template's), like this stack's routes.
      REDIRECT_HOST_SUFFIXES: "${REDIRECT_HOST_SUFFIXES:-${DOMAIN}}"
      BACKEND_HOST: "admin-app"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # 30 days, matching the PCS-wide session policy. Revocation is what makes
      # that safe on a privileged app: deleting an account or resetting its
      # password makes admin-app call the gate's control API and end sessions
      # already in flight, so a long TTL is no longer a long window of
      # un-withdrawable access.
      SESSION_DURATION_HOURS: "720"
      # Shared with admin-app, used in both directions: the gate signs identity
      # assertions with it, the app verifies them and signs revocation calls back.
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET}
      # DELIBERATELY NOT SET — OIDC_REQUIRED_GROUPS. Gate-level group enforcement
      # would lock a non-admin account out of the dashboard entirely, while the app
      # is built to let one in as far as its own Account panel and 403 the rest
      # (adminMiddleware). Authorization stays in the app, where it can be partial;
      # the gate does authentication.
      #
      # NO MACHINE/API PATH, deliberately. AppShield 3.0 removed AUTH_HASH
      # entirely; machine access would now mean setting OAUTH_RESOURCE to run the
      # OAuth 2.1 broker, and this gate does not. The non-interactive trust path
      # is Path C (support SSH -> docker exec admin-app -> loopback HTTP), which
      # bypasses this gate by construction and is gated by loopbackOnly on the
      # handler itself.
      #
      # Only what MUST answer without a credential; everything else, the SPA's own
      # assets included, is fetched by an already-authenticated browser. This list
      # is deliberately TIGHTER than admin-app's own bypass list in serverGate.ts:
      # stricter here is invisible, looser here would mean the app 302s requests
      # the gate let through.
      #   api/health          the operator polls it during provisioning, BEFORE the
      #                       box has any credential — if this required auth, a
      #                       fresh PCS could never be declared ready
      #   api/perf, api/bench `pcs perf` reads them; RAM-cached snapshots
      #   api/identity        the operator's identity push (key + push). It must
      #                       reach a box that lost every credential, so it
      #                       cannot sit behind a login; a bundle is applied only
      #                       if signed by the trusted issuer, encrypted to a
      #                       one-time key, and addressed to this host
      #                       (pcs-orchestrator doc/identity-push.md)
      ALLOWED_PATHS: "api/health,api/perf,api/bench,api/identity"
    # THE OIDC BACK-CHANNEL STAYS ON THE BOX, with nothing configured here.
    # auth-registrar answers /register with `internal_issuer_url: http://dex:5556`
    # beside the public issuer (INTERNAL_ISSUER_URL, auth stack), and AppShield
    # >= 3.1.0 sends its discovery, code->token exchange and JWKS fetch there —
    # container to container on `pcs` — while the issuer string, the tokens and
    # every URL the browser sees stay https://auth-${DOMAIN}.
    #
    # Resolved publicly, those calls left the PCS, crossed Cloudflare and the
    # mesh-router CF Worker and re-entered this machine. On demostaging2
    # (2026-09-15) that path answered ~70% of requests with an empty body: they
    # carried the CF Worker's X-Request-ID but no `via: 1.1 Caddy`, so they never
    # reached the box, and the broken Cloudflare colo was the one the PCS's own
    # egress uses — invisible from anywhere except the machine living with it.
    # This gate matters most: it fronts the onboarding wizard, so a box whose SSO
    # back-channel is flaky cannot be claimed at all.
    #
    # Until 3.1.0 this was done from outside the binary: an extra_hosts pin of
    # auth-${DOMAIN} to host-gateway, plus SSL_CERT_DIR and a read-only mount of
    # the mesh CA, because the pinned call terminated on this box's Caddy. Do not
    # bring it back — it made every gate depend on a path inside the mesh stack's
    # state. Dex still carries it, for the Local Account connector (auth stack).
    #
    # A gate logging `back-channel via the public issuer` registered with a
    # registrar that did not send the field (mesh-auth < 1.1.7, or the gate's
    # first login beat the auth stack's deploy). Restarting the gate re-registers.
    volumes:
      # Gate state: persisted sessions (sessions.json). Without this mount a
      # container recreate signs everyone out regardless of SESSION_DURATION_HOURS.
      # Beside the app's own /app/data, outside the rsync'd stack tree.
      #
      # OWNERSHIP IS LOAD-BEARING: the gate runs as 65534 (pinned above) and writes
      # sessions.json through a temp file in this directory, so it needs the DIR
      # writable, not just the file. ensure-user-compose-stack-up.sh chowns it. Found
      # on wisera 2026-09-28 owned 1000:1000 with a 0600 sessions.json from
      # 2026-08-19: every login logged "[session] save failed: permission denied"
      # and the 720h SESSION_DURATION_HOURS above was fiction for this one app —
      # each gate restart silently signed the owner out.
      - type: bind
        source: /DATA/AppData/yundera/admin/gate-data
        target: /data
    expose:
      - "80"
    networks:
      pcs: null
    depends_on:
      - admin-app
    # Routed by template/stacks/yundera/routes, rendered into docker-compose.override.yml
    # once per routing domain of the box: this file names no domain.

  admin-app:
    # The Yundera admin app (settings-center-app 2.x): Go + an embedded Svelte UI.
    # 2.0 replaced the 1.x Next.js image (1.9 GB, ~160 MB resident) with a ~35 MB
    # static binary using ~10 MB, and SSH-to-the-host with the Docker socket.
    image: ghcr.io/yundera/settings-center-app:2.2.3
    container_name: admin-app
    hostname: admin-app
    restart: unless-stopped
    cpu_shares: 40
    mem_limit: 128m
    # Env is enumerated, not injected wholesale: the app's key set is small and
    # fixed, and nothing from .pcs.secret.env enters this container through env.
    # The ${...} substitutions resolve against this folder's generated .env.
    environment:
      # The stack root on the HOST. Host actions run in the host's namespaces, so
      # they need host paths; the app's read-only view of the same tree is the
      # /yundera mount below.
      COMPOSE_FOLDER_PATH: "/DATA/AppData/yundera"
      # This container's own name: host actions run in a one-shot sibling created
      # from the image this container runs (nsenter into PID 1), found through it.
      SELF_CONTAINER: admin-app
      # Identity comes from the `admin` gate in front of this container — and is
      # re-checked here rather than trusted: the app validates the gate's
      # per-request assertion with this shared secret and refuses every request
      # without one (internal/auth). The SAME secret signs the control tokens the
      # app uses to ask the gate to end other sessions when onboarding is reset
      # (internal/gatectl).
      #
      # Minted once by ensure-user-compose-stack-up.sh. Were it missing, this app would
      # authenticate nobody — the correct failure direction, and the reason the gate
      # must never be the only thing checking.
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET}
      # Expected `aud` on those assertions = the gate's APP_NAME (set explicitly on
      # the gate above, not left to its hostname default, so the pairing is
      # readable from either side).
      IDENTITY_ASSERTION_AUDIENCE: "admin"
      # Where to reach the gate's control API — its own sidecar, by container name.
      APPSHIELD_GATE_URL: "http://admin"
      # Where the browser POSTs at logout to end the local-account (Authelia)
      # session before the gate's own logout. Authelia's cookie is what decides
      # whether the next sign-in asks for a password: while it stands, Dex re-runs
      # the connector and the user is back in without typing anything. It must be
      # the BROWSER that calls it (the cookie is host-only on local-auth-${DOMAIN});
      # Authelia sends no CORS headers, so the app fires a no-cors POST.
      UPSTREAM_LOGOUT_URL: "https://local-auth-${DOMAIN}/api/logout"
      # Box identity: links, support reports, Maison feedback. An identity push
      # can change DOMAIN before this container is recreated; the app prefers the
      # fresh value in .ynd.user.env (read through /yundera).
      DOMAIN: ${DOMAIN}
      UID: ${UID}
      PUBLIC_IP: ${PUBLIC_IP}
      # Yundera control plane base URL: the support SSH key, the default identity
      # issuer (${OPERATOR_API}/auth) and the subscription dashboard link.
      OPERATOR_API: ${OPERATOR_API}
      # Optional per-PCS override of the support-report recipient; set it in
      # .pcs.env. Empty = support@yundera.com.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Bearer Maison's "Send feedback" presents to /api/feedback/ingest — the same
      # value the mesh .env gives Maison (library/mesh.sh). Every container on pcs
      # can reach this app directly, so the token is what keeps a store app from
      # mailing Yundera. Minted by ensure-mesh-installed.sh; unset => 404.
      FEEDBACK_TOKEN: ${FEEDBACK_TOKEN:-}
      # Bearer Maison presents to /api/onboarding/check on every browser navigation,
      # to ask whether to send the owner to the onboarding slides ({show,url}). Maison
      # holds the same value as its `onboarding_token` secret, set by
      # ensure-maison-onboarding.sh. Reached over pcs, not through the gate, so the
      # token is what keeps a store app from reading the box's onboarding state.
      # Minted by ensure-mesh-installed.sh; unset => 404.
      ONBOARDING_CHECK_TOKEN: ${ONBOARDING_CHECK_TOKEN:-}
    volumes:
      # Host actions (self-check, feature switches, onboarding, the identity
      # push, support access, reboot) run in a one-shot privileged container this
      # app creates through the socket — the mesh-console / auth-console pattern.
      # The socket is root on the host; 1.x held the same power through an SSH
      # key in /home/admin/.ssh (removed by
      # migrations/2026-10-15-10-drop-admin-app-ssh-key.sh).
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # The Yundera tree, READ-ONLY: the self-check log, .pcs.env and the other
      # env files, template/.revision.json. Every write goes through a host action.
      - type: bind
        source: /DATA/AppData/yundera
        target: /yundera
        read_only: true
      # The app's OWN writable state (identity-state.json: the last identity push
      # applied). The gate's state sits beside it in gate-data/ (see the gate
      # above). Outside the rsync'd template subtree.
      - type: bind
        source: /DATA/AppData/yundera/admin
        target: /app/data
      # Self-check log timestamps are host local time; this makes "ran 9 hours
      # ago" true.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    # No route and no published port: the ONLY public route in is the
    # gate above, which owns the `admin-*` hostnames. `expose` keeps port 80
    # reachable inside `pcs` — which is precisely why this app verifies the gate's
    # signed assertion instead of trusting forwarded headers: every container on
    # `pcs` can open a socket here.
    expose:
      - "80"
    networks:
      pcs: null


  # NOTE: CasaOS is gone (Maison migration phase 3, 2026-08-02). It was split out
  # of this stack in phase 1 precisely so that retiring it would be a stack deletion
  # rather than surgery on this file — and it was: stacks/casaos/ and
  # ensure-casaos-stack.sh are deleted, and the container was torn down on existing
  # hosts by a teardown migration (retired 2026-09-08) that also repointed the root
  # domain (DEFAULT_SERVICE_HOST) at the Maison AppShield gate. `casaos-oidc-bridge`
  # died earlier — Authelia is the local credential now. /DATA/AppData/casaos
  # survives as a plain directory of dead data, including the stale pre-2026-09-08
  # copy of this stack at apps/yundera. See doc/maison-migration.md.
  #
  # NOTE: mesh-router-tunnel, -agent, -caddy and smtp live in the `mesh` stack, and
  # dex, authelia and auth-registrar in the `auth` stack — both the stock
  # mesh-router-template-root's, installed into /DATA/AppData/mesh by
  # ensure-mesh-installed.sh (doc/mesh-stock-switch.md). This template no longer
  # ships its own copies. What is left here is the admin app.

networks:
  # Shared by every stack and owned by none: created by ensure_pcs_network
  # (library/stacks.sh) before any stack comes up. This stack used to create it,
  # which made every other stack's deploy depend on this one having run first. A
  # box provisioned before the split keeps the yundera-labelled network; joining it
  # as external is fine.
  pcs:
    name: pcs
    external: true

x-casaos:
  main: admin
  author: Yundera Team
  category: pcs
  hostname: admin-${DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/Yundera/settings-center-app@main/web/public/icon.svg
  index: /
  is_uncontrolled: false
  port_map: ""
  scheme: https
  store_app_id: yundera
  title:
    custom: Yundera

# Maison reads this in preference to x-casaos, field by field.
#
# IT EXISTS BECAUSE OF THE ${DOMAIN} ABOVE. Maison parses compose files with a
# plain yaml.Unmarshal — it never interpolates, and never reads the sibling .env —
# so it copies `x-casaos.hostname` verbatim and the Settings tile links to the
# literal https://admin-${DOMAIN}/. Every CasaOS *store* app escapes this because
# CasaOS's installer bakes the resolved hostname into the app's compose file at
# install time; this stack is the template itself, never installed, so its
# placeholder survives on disk. x-compose-app's `webui-host` is the one field
# Maison substitutes (${DOMAIN}/${domain} -> the APP_DOMAIN it reads from .env.app),
# which is exactly the host the admin route (template/stacks/yundera/routes) publishes.
x-compose-app:
  schema_version: 2
  id: yundera
  title:
    en_us: Yundera
  # FALLBACK ONLY. The tile renders from /DATA/AppData/yundera/.icon.svg — placed
  # by the root-move migration from root/icon.svg, which is vendored beside this
  # file and serves the same asset as this URL. Maison prefers that file over the
  # URL for any managed app (>= 1.1.18), which is what stops the Settings tile
  # going blank on an offline box or a moved repo path. Re-vendor from
  # settings-center-app's web/public/icon.svg (the Yundera mark) if it changes there.
  icon: https://cdn.jsdelivr.net/gh/Yundera/settings-center-app@main/web/public/icon.svg
  category: pcs
  developer: Yundera Team
  # This stack is the admin app — mesh-router and auth have their own stacks and
  # tiles now (the mesh template's `mesh` and `auth`). `system` puts its tile in Maison's
  # System grid — on a current Maison that is all it does. Images before the
  # lifecycle keys derive the stop/uninstall guard from it (>= 1.1.5, replacing the
  # maison stack's PROTECTED_APPS env), so it stays; the Maison version is the pin
  # in the mesh template's stacks/maison/docker-compose.yml.
  view: system
  webui-host: admin-${DOMAIN}
  webui-scheme: https
  webui-path: /
  # Since the root move this file IS /DATA/AppData/yundera/docker-compose.yml,
  # so Maison's stat(AppsDir/<project>/docker-compose.yml) makes the tile managed
  # directly — and managed is exactly what makes a stray Uninstall click
  # reachable. (It used to be a copy placed by ensure-maison-yundera-mirror.sh,
  # retired with the move.) Restart is still offered.
  lifecycle:
    stoppable: false
    uninstallable: false
    # Updated by the template that deploys it, not from a store: no row on Maison's Updates page.
    updatable: false
  # Not backed up. This folder is the platform tree: the template the self-check
  # re-syncs every night, plus the stacks' secrets — restoring an old copy of it
  # over a live box does more harm than good. `skip` also closes the manual
  # Backups-tab path.
  backup:
    skip: true
