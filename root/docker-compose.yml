name: yundera
services:
  # =============================================================================
  # ADMIN GATE (AppShield) — the only public entrypoint to the dashboard.
  #
  #   admin      = this gate. Owns admin-${DOMAIN} and the login flow.
  #   admin-app  = settings-center-app itself (below). No public route.
  #
  # The dashboard used to be its own OIDC client. It is not any more: one system
  # (AppShield) fronts every platform app — Maison, store apps, this — so there is
  # one auth surface to review instead of one per app.
  #
  # NAMING IS LOAD-BEARING, exactly as in stacks/maison: the auth-registrar derives
  # an app's client_id from a PTR lookup of the CALLER's container name on the pcs
  # network, and only ever issues redirect URIs under `<client_id>-<suffix>`. So
  # the gate must be the container named `admin`, and the app takes the suffixed
  # name. Swap them and the OIDC callback lands on a hostname the caddy_* labels
  # below do not publish, and login dead-ends.
  # =============================================================================
  admin:
    image: ghcr.io/yundera/appshield:3.0.0
    container_name: admin
    hostname: admin
    restart: unless-stopped
    cpu_shares: 40
    mem_limit: 128m
    environment:
      # The gate's identity to the registrar AND the `aud` of every assertion it
      # signs. Explicit rather than relying on AppShield's hostname default,
      # because admin-app verifies this exact value.
      APP_NAME: "admin"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Pre-registration guess / fallback if /register is unreachable; the
      # registrar's own list is what actually decides (appshield >= 2.0.10,
      # mesh-auth >= 1.1.4). Keep it matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "admin-app"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # 30 days, matching the PCS-wide session policy. Revocation is what makes
      # that safe on a privileged app: deleting an account or resetting its
      # password makes admin-app call the gate's control API and end sessions
      # already in flight, so a long TTL is no longer a long window of
      # un-withdrawable access.
      SESSION_DURATION_HOURS: "720"
      # Shared with admin-app, used in both directions: the gate signs identity
      # assertions with it, the app verifies them and signs revocation calls back.
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET}
      # DELIBERATELY NOT SET — OIDC_REQUIRED_GROUPS. Gate-level group enforcement
      # would lock a non-admin account out of the dashboard entirely, while the app
      # is built to let one in as far as its own Account panel and 403 the rest
      # (adminMiddleware). Authorization stays in the app, where it can be partial;
      # the gate does authentication.
      #
      # NO MACHINE/API PATH, deliberately. AppShield 3.0 removed AUTH_HASH
      # entirely; machine access would now mean setting OAUTH_RESOURCE to run the
      # OAuth 2.1 broker, and this gate does not. The non-interactive trust path
      # is Path C (support SSH -> docker exec admin-app -> loopback HTTP), which
      # bypasses this gate by construction and is gated by loopbackOnly on the
      # handler itself.
      #
      # Only what MUST answer without a credential; everything else, the SPA's own
      # assets included, is fetched by an already-authenticated browser. This list
      # is deliberately TIGHTER than admin-app's own bypass list in serverGate.ts:
      # stricter here is invisible, looser here would mean the app 302s requests
      # the gate let through.
      #   api/health          the operator polls it during provisioning, BEFORE the
      #                       box has any credential — if this required auth, a
      #                       fresh PCS could never be declared ready
      #   api/perf, api/bench `pcs perf` reads them; RAM-cached snapshots
      #   api/brand           name/logo only, no secrets
      ALLOWED_PATHS: "api/health,api/perf,api/bench,api/brand"
    volumes:
      # Gate state: persisted sessions (sessions.json). Without this mount a
      # container recreate signs everyone out regardless of SESSION_DURATION_HOURS.
      # Beside the app's own /app/data, outside the rsync'd stack tree.
      - type: bind
        source: /DATA/AppData/yundera/admin/gate-data
        target: /data
    expose:
      - "80"
    networks:
      pcs: null
    depends_on:
      - admin-app
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: admin-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant for direct access (custom CA)
      caddy_1: admin-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant for direct access (Let's Encrypt)
      caddy_2: admin-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  admin-app:
    image: ghcr.io/yundera/settings-center-app:1.4.2
    container_name: admin-app
    hostname: admin-app
    restart: unless-stopped
    cpu_shares: 90
    # Safety net, not a tight cap. The Next.js + tsx server steady-states a few
    # hundred MB; 1G leaves room for esbuild workers and a transient spike
    # without an OOM kill, but bounds a runaway leak.
    mem_limit: 1g
    # Env is enumerated, not injected wholesale. This used to be `env_file: .env`
    # — every key of the unified .env (assembled by ensure-env-vars-valid.sh from
    # .pcs.env + .pcs.secret.env + .ynd.user.env) — because the old System
    # Configuration page displayed whatever it was handed, so a renamed key showed
    # as a silently blank field. That page is gone (System Information now shows
    # only the public IP and the reboot button), the app's key set is small and
    # fixed, and each remaining one fails loudly rather than blankly.
    #
    # This is the app's ONLY channel to these values — the stack directory is no
    # longer bind-mounted (see the volumes note below). The ${...} substitutions
    # resolve against this same .env, which compose reads from the project
    # directory, exactly as the caddy labels below already do. What no longer
    # rides along: DEFAULT_PWD, USER_JWT, AUTHELIA_DEX_SECRET, and PROVIDER_STR
    # (which the Domain panel used to display, and which the mesh-router and smtp
    # services below still interpolate for their own use). None of them are read
    # by the app — and Terminal/TerminalHandler.ts spreads process.env into every
    # shell it spawns, so they were reaching the web terminal too. Nothing from
    # .pcs.secret.env now enters this container.
    environment:
      COMPOSE_FOLDER_PATH: "/DATA/AppData/casaos/apps/yundera/"
      # Identity comes from the `admin` gate in front of this container — and is
      # re-checked here rather than trusted: the app validates the gate's
      # per-request assertion with this shared secret and refuses every request
      # without one (backend/auth/gateIdentity.ts). The SAME secret signs the
      # control tokens the app uses to ask the gate to revoke sessions when an
      # account is deleted or its password reset (backend/auth/gateControl.ts).
      #
      # Minted once by ensure-admin-gate-secret.sh. Were it missing, this app would
      # authenticate nobody — the correct failure direction, and the reason the gate
      # must never be the only thing checking.
      IDENTITY_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET}
      # Expected `aud` on those assertions = the gate's APP_NAME (set explicitly on
      # the gate above, not left to its hostname default, so the pairing is
      # readable from either side).
      IDENTITY_ASSERTION_AUDIENCE: "admin"
      # Where to reach the gate's control API — its own sidecar, by container name.
      APPSHIELD_GATE_URL: "http://admin"
      # Where the browser POSTs at logout to end the UPSTREAM IdP's session.
      #
      # The gate ends its own session at /nhl-auth/logout, but Authelia's cookie
      # is what actually decides whether the next sign-in asks for a password:
      # while it stands, Dex re-runs the connector, Authelia answers from its
      # 30-day session, and the user is back in without typing anything. Ending
      # it is what turns the connector chooser from theatre into a real prompt.
      #
      # A full URL, not a flag, because the app must not know which IdP this is —
      # it ships in the FOSS mesh template too. Unset it and logout simply ends
      # the gate session.
      #
      # POST /api/logout is Authelia's own portal API. It has to be called by the
      # BROWSER: the cookie is host-only on local-auth-${DOMAIN} and never
      # reaches this container. Same-site with admin-${DOMAIN}, so SameSite=lax
      # lets it ride. Authelia sends no CORS headers and its /logout page sets
      # frame-ancestors 'none' — a no-cors POST is the one shape that works, and
      # is why this is a plain URL the client fires rather than a redirect.
      UPSTREAM_LOGOUT_URL: "https://local-auth-${DOMAIN}/api/logout"
      # Resolves the brand and labels support reports. (It used to also build the
      # OIDC redirect URI; the app no longer runs an OIDC flow of its own.)
      DOMAIN: ${DOMAIN}
      # Identifies the PCS in support reports.
      UID: ${UID}
      # Certificates panel derives the nip.io / sslip.io domains from it.
      PUBLIC_IP: ${PUBLIC_IP}
      # Operator control-plane base URL: support key exchange (SupportKey.ts) +
      # operator detection in resolveBrand. Both names carry the same value —
      # OPERATOR_API is current, YUNDERA_API is what it was called before
      # migrations/2026-08-04-11-rename-yundera-api.sh. Feeding them from one
      # expression makes the upgrade order irrelevant: on the tick the migration
      # runs, the unified .env still only has the old key (it is regenerated
      # earlier in the chain), and an admin image older than the rename still
      # only reads the old name. Drop YUNDERA_API once neither is true.
      OPERATOR_API: ${OPERATOR_API:-${YUNDERA_API:-}}
      YUNDERA_API: ${OPERATOR_API:-${YUNDERA_API:-}}
      # Current value of the root-domain target, shown by the Domain panel's
      # default-app editor. Writes go to .pcs.env on the host over SSH, not here.
      DEFAULT_SERVICE_HOST: ${DEFAULT_SERVICE_HOST}
      DEFAULT_SERVICE_PORT: ${DEFAULT_SERVICE_PORT}
    volumes:
      # The admin app SSHes back to the host as the `admin` sudoer (created by
      # ensure-admin-user.sh). Privileged work goes through `sudo -n …` on the
      # host. The container generates a fresh keypair on every start and writes
      # the pubkey here, which is admin's authorized_keys.
      - type: bind
        source: /home/admin/.ssh/
        target: /host_ssh/
      # The app's OWN writable state. No session-signing key any more — the gate
      # owns sessions, so admin-session-key and session-epochs.json are gone — but
      # brand.json overrides are read from here (src/brand/loadBrandFile.ts), and
      # the gate's own state sits beside it in gate-data/ (see the gate above).
      #
      # This used to be the whole stack directory (/DATA/AppData/casaos/apps/yundera),
      # on the theory that the app needed it "to update itself". It does not: every
      # compose/env/self-check operation runs on the HOST over SSH with host paths
      # (COMPOSE_FOLDER_PATH above is a host path, never a container path — see
      # DockerUpdate.ts, update-channel.ts, default-app.ts), and the session key was
      # the only file the container ever opened locally.
      #
      # Worse, that directory is the rsync target of ensure-template-sync.sh, which
      # runs `rsync -a --delete` honouring .ignore — and admin-session-key was not in
      # .ignore, so every template update deleted it and the next container start
      # minted a new one, signing every user out. Exactly what persisting the key was
      # supposed to prevent. Keeping it here, beside dex/ and auth/, puts it outside
      # the synced tree. Docker creates the dir on first up; migrations/
      # 2026-08-02-13-move-admin-session-key.sh carried the old key across and is
      # now historical — nothing reads that key.
      - type: bind
        source: /DATA/AppData/yundera/admin
        target: /app/data
    # No caddy_* labels and no published port: the ONLY public route in is the
    # gate above, which owns the `admin-*` hostnames. `expose` keeps port 80
    # reachable inside `pcs` — which is precisely why this app verifies the gate's
    # signed assertion instead of trusting forwarded headers: every container on
    # `pcs` can open a socket here.
    expose:
      - "80"
    networks:
      pcs: null


  # NOTE: CasaOS is gone (Maison migration phase 3). It was split out of this
  # stack in phase 1 precisely so that retiring it would be a stack deletion
  # rather than surgery on this file — and it was: stacks/casaos/ and
  # ensure-casaos-stack.sh are deleted, and the container is torn down on
  # existing hosts by scripts/migrations/2026-08-02-14-remove-casaos-stack.sh,
  # which also repoints the root domain (DEFAULT_SERVICE_HOST) at the Maison
  # AppShield gate. `casaos-oidc-bridge` died earlier — Authelia is the local
  # credential now. /DATA/AppData/casaos survives as a plain directory: it holds
  # apps/, including apps/yundera, which is this stack. See doc/maison-migration.md.




  # =============================================================================
  # MESH ROUTER TUNNEL (v2)
  # Establishes WireGuard VPN tunnel to the provider for NAT traversal
  # =============================================================================
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.2.10
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cpu_shares: 90
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  
  # =============================================================================
  # MESH ROUTER AGENT (v2)
  # Registers public IP with backend for direct routing (bypasses VPN)
  # =============================================================================
  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.0.11
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    cpu_shares: 90
    environment:
      - PROVIDER=${PROVIDER_STR}
      # Must stay in sync with Caddy's ${PUBLIC_IP_DASH}-based labels — registering
      # any other family here causes the CF Worker to rewrite Host to a hostname
      # Caddy doesn't know, and every subdomain falls into the catch-all.
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
    volumes:
      - /DATA/AppData/yundera/data/certs:/app/data
    networks:
      pcs: null

  
  # =============================================================================
  # MESH ROUTER CADDY (v2)
  # Reverse proxy with Docker container discovery via labels
  # =============================================================================
  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.6
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    cpu_shares: 90
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A DIRECTORY, not the Caddyfile itself. A single-file bind mount is pinned
      # to the inode it started with, and ensure-template-sync.sh updates the
      # template with rsync — which renames a new file into place. Mounted as a
      # file, this container would keep serving the Caddyfile it booted with,
      # silently and forever: caddy-docker-proxy re-reads the path on every
      # generation, so the config always looked freshly built. Observed in the
      # field as an eight-week-old Caddyfile behind a correct-looking config.
      # The dir also cannot be the app root — .pcs.secret.env lives there.
      - /DATA/AppData/casaos/apps/yundera/caddy:/etc/caddy:ro
      - /DATA/AppData/yundera/data/certs:/certs:ro
      - /DATA/AppData/yundera/data/caddy/data:/data
      - /DATA/AppData/yundera/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=admin@${DOMAIN}
      # Root domain routing configuration
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.0.4
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    cpu_shares: 70
    environment:
      # Provider mode: route mail through the mesh-router-backend that owns this PCS's domain
      # (same as the nsl path), sending from <app>.<user-domain>@<server-domain>. The gateway
      # derives the endpoint + credential from PROVIDER_STR — no orchestrator email API.
      RELAY_CREDENTIAL: "${PROVIDER_STR}"
      SMTP_PORT: "587"
    expose:
      - "587"
    networks:
      pcs: null


  # =============================================================================
  # DEX - OIDC identity broker for PCS apps (replaces Authelia)
  # Apps delegate login via OIDC authorization_code flow. Endpoints:
  #   https://auth-${DOMAIN}/.well-known/openid-configuration
  # User identity is federated to Authelia (the PCS-local credential store) and,
  # when the box has a Yundera account, to the orchestrator's IdP — see the
  # connectors in dex.config.yaml.tmpl and the tail of ensure-dex.sh. The old
  # CasaOS connector (casaos-oidc-bridge) is gone.
  # App clients are registered dynamically by auth-registrar over
  # Dex's gRPC API — no static client list. Config + sqlite + issued client
  # secrets are provisioned by scripts/self-check/ensure-dex.sh into
  # /DATA/AppData/yundera/dex/.
  # =============================================================================
  dex:
    # PINNED BY DIGEST TO A `master` BUILD, DELIBERATELY — not a release tag.
    #
    # The logout features this PCS depends on are merged upstream but UNRELEASED:
    # RP-Initiated Logout (PR #4674, 2026-04-01) and Back-Channel Logout with a
    # `sid` claim (PR #4945, 2026-07-30). The newest release, v2.45.1
    # (2026-03-03), predates both and advertises no logout of any kind — which is
    # why "log out" could not log anybody out. See SSO-LOGOUT-PLAN.md §10.
    #
    # By DIGEST and not `:master`, because `:master` is a moving tag: every push
    # to trunk would silently reach the whole fleet on the next
    # ensure-user-compose-pulled.sh. This digest is the 2026-08-06 build,
    # verified to advertise end_session_endpoint + backchannel_logout_supported.
    #
    # REPIN TO A RELEASE as soon as one ships with both PRs (expected > v2.45.1).
    # The delta from v2.45.1 is large — trunk restructured server/ into logout/,
    # backchannel/, discovery/, consent/, mfa/ packages — so this is a bigger
    # unreleased surface than "a logout patch" implies.
    image: ghcr.io/dexidp/dex@sha256:af9469509350ff3f6ca70127175a58e5ab085b9d18740fa4a590d9f03f0a026b
    container_name: dex
    hostname: dex
    restart: unless-stopped
    cpu_shares: 80
    command: ["dex", "serve", "/data/config.yaml"]
    environment:
      # Gates the whole `sessions:` block in dex.config.yaml.tmpl. Dex REFUSES TO
      # START with a sessions config and this unset ("sessions config requires
      # sessions to be enabled"), so the two must move together.
      #
      # Turning it on gives Dex a real `dex_session` browser cookie, which is
      # what makes it an OP you can log out of — and what replaces the
      # connector-stickiness rules that used to live in caddy/Caddyfile.
      DEX_SESSIONS_ENABLED: "true"
    # If a connector's issuer is NOT served with a publicly-trusted cert (e.g. an
    # internal-CA-only test host), Dex's back-channel TLS to it will fail; in
    # that case add a CA bundle to the environment block above:
    #     SSL_CERT_FILE: /data/ca-bundle.crt
    volumes:
      # config.yaml (rendered) + dex.db (sqlite). This is CACHE, not precious
      # data — see the recovery note in scripts/self-check/ensure-dex.sh.
      - /DATA/AppData/yundera/dex:/data
      # Custom "yundera" frontend, overlaid onto the stock image (no frontend.dir,
      # so all other stock templates/static stay intact). ensure-dex.sh renders
      # these from the template's dex-theme/ before the stack comes up.
      - /DATA/AppData/yundera/dex-frontend/templates/login.html:/srv/dex/web/templates/login.html:ro
      - /DATA/AppData/yundera/dex-frontend/templates/header.html:/srv/dex/web/templates/header.html:ro
      - /DATA/AppData/yundera/dex-frontend/themes/yundera:/srv/dex/web/themes/yundera:ro
    expose:
      - "5556"   # OIDC web endpoints (Caddy terminates TLS), bound on pcs
      - "5557"   # gRPC client-mgmt API — UNAUTHENTICATED, bound to dex-internal IP only
    networks:
      pcs: null
      # gRPC (5557) is bound to this static IP in config.yaml.tmpl, so it is
      # reachable ONLY by containers on dex-internal (just auth-registrar).
      dex-internal:
        ipv4_address: 172.31.7.2
    # No `depends_on` for the connectors: authelia is in this stack but Dex must
    # not block on it, and the Yundera IdP is off-box entirely. Dex retries a
    # connector's back-channel on use, so cold-boot ordering resolves itself.
    # Unlike every other service here, these labels declare ONLY the hostnames:
    # the TLS choice and the upstream live in the (dex_router*) snippets in
    # caddy/Caddyfile. That is where the connector-memory rules are — named
    # matchers, `uri`, and a `handle_response` block, none of which can be
    # expressed as flat caddy-docker-proxy labels. Keep the hostname list here in
    # sync with the three auth-* hostnames; everything else is in the snippet.
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-${DOMAIN}
      caddy_0.import: dex_router_tls
      # nip.io variant for direct access (custom CA)
      caddy_1: auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: dex_router_tls
      # sslip.io variant for direct access (Let's Encrypt)
      caddy_2: auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.import: dex_router


  # =============================================================================
  # AUTHELIA - local-account IdP, federated by Dex as the "Local Account" connector
  # Owns the credential that used to live in CasaOS. Exactly ONE OIDC client
  # (Dex); no dynamic app-client registration (that stays on Dex's gRPC path).
  # Serves its own login UI at local-auth-${DOMAIN} — which carries the built-in
  # "Reset password?" link and drives the email reset flow through the local
  # smtp relay. Config + secrets + users_database.yml are provisioned by
  # scripts/self-check/ensure-authelia.sh into /DATA/AppData/yundera/auth/.
  # =============================================================================
  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    cpu_shares: 80
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      # configuration.yml (rendered) + db.sqlite + users_database.yml + secrets.
      # Unlike the dex dir this holds the local account — back it up.
      - /DATA/AppData/yundera/auth:/config
    expose:
      - "9091"
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed). Distinct host from Dex's
      # auth-${DOMAIN}: Dex is the broker, Authelia is the connector behind it.
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"
      # nip.io variant for direct access (custom CA)
      caddy_1: local-auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9091}}"
      # sslip.io variant for direct access (Let's Encrypt)
      caddy_2: local-auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9091}}"


  # =============================================================================
  # AUTH-REGISTRAR - OIDC client self-registration for PCS apps
  # Sidecars (e.g. nginx-hash-lock) POST their redirect URIs to
  #   http://auth-registrar:9092/register
  # on first login and get back {client_id, client_secret, issuer_url}. Caller
  # identity is derived from the source IP via PTR lookup on the pcs network —
  # client_id is never accepted as input. Intentionally NOT publicly routable.
  # In Dex mode it calls Dex's gRPC CreateClient.
  #
  # STATELESS: the registrar's client-secret cache lives inside the container
  # (DEX_CLIENTS_DIR=/tmp/dex-clients) and is deliberately NOT bind-mounted to the
  # data volume — there is no per-client secret to back up. Within a container
  # lifetime the cache makes re-registration idempotent (same secret); after a
  # restart the cache is empty and the registrar transparently rotates each
  # client's secret on its next /register. Apps re-register on every login, so
  # this is invisible. See: packages/mesh-router-root/mesh-router-auth/README.md
  # =============================================================================
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.5
    container_name: auth-registrar
    hostname: auth-registrar
    restart: unless-stopped
    cpu_shares: 40
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      REGISTRAR_BACKEND: dex
      # Dex gRPC is reachable only on the isolated dex-internal net (static IP)
      DEX_GRPC_ADDR: 172.31.7.2:5557
      # ephemeral in-container cache (NOT persisted) — see note above
      DEX_CLIENTS_DIR: /tmp/dex-clients
      # Allowed redirect-URI host suffixes (comma-separated). An app's permitted
      # hosts are <app>-<suffix> for each; the registrar verifies every requested
      # callback against this exact set. Must list the SAME suffixes the apps'
      # caddy_* labels use — the user domain plus the IP-based fallbacks.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      # The one app allowed to register callbacks on the BARE suffixes
      # (${DOMAIN} itself, not just <app>-${DOMAIN}) — i.e. whoever the root
      # domain reverse-proxies to in the Caddyfile above.
      #
      # Deliberately the SAME variable that drives that Caddy block: "the app
      # that owns the bare hostname" and "the app the bare hostname routes to"
      # are then one fact rather than two settings that can drift. The Domain
      # panel writes it to .pcs.env and triggers a self-check, so this container
      # is recreated on the same tick the root route repoints.
      #
      # It is a proxy upstream target, not an identity: `host.docker.internal`
      # is legal here and is not a container name. The registrar validates it
      # and falls back to "nobody owns the bare hosts" rather than guessing —
      # check the `root app:` line in `docker logs auth-registrar` if a login on
      # the bare domain still lands on <app>-${DOMAIN}.
      #
      # Needs mesh-auth >= 1.1.4; older images ignore this and apps keep the
      # pre-existing bounce-to-<app>-${DOMAIN} behaviour.
      ROOT_CLIENT_ID: "${DEFAULT_SERVICE_HOST}"
    expose:
      - "9092"
    networks:
      pcs: null            # /register from app sidecars + PTR attestation
      dex-internal: null   # gRPC to Dex
    depends_on:
      - dex

networks:
  pcs:
    name: pcs
  # Isolated gRPC-only net for the auth-registrar <-> Dex client-management API.
  # internal: true → no egress (Dex's egress comes from the pcs network it is also
  # on). App containers live only on pcs, so they cannot reach Dex's gRPC port
  # (5557), which is bound to 172.31.7.2 on this net. The subnet is pinned so Dex
  # can bind gRPC to a known IP — keep it clear of other host docker networks.
  dex-internal:
    name: dex-internal
    internal: true
    ipam:
      config:
        - subnet: 172.31.7.0/29

x-casaos:
  main: admin
  author: Yundera Team
  category: pcs
  hostname: admin-${DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/Yundera/settings-center-app@main/public/YunderaPCS-setting_iconV2.svg
  index: /
  is_uncontrolled: false
  port_map: ""
  scheme: https
  store_app_id: yundera
  title:
    custom: Settings

# Maison reads this in preference to x-casaos, field by field.
#
# IT EXISTS BECAUSE OF THE ${DOMAIN} ABOVE. Maison parses compose files with a
# plain yaml.Unmarshal — it never interpolates, and never reads the sibling .env —
# so it copies `x-casaos.hostname` verbatim and the Settings tile links to the
# literal https://admin-${DOMAIN}/. Every CasaOS *store* app escapes this because
# CasaOS's installer bakes the resolved hostname into the app's compose file at
# install time; this stack is the template itself, never installed, so its
# placeholder survives on disk. x-compose-app's `webui-host` is the one field
# Maison substitutes (${DOMAIN}/${domain} -> the APP_DOMAIN it reads from .env.app),
# which is exactly the value the caddy_0 label on the admin service publishes.
x-compose-app:
  schema_version: 2
  id: yundera
  title: Settings
  icon: https://cdn.jsdelivr.net/gh/Yundera/settings-center-app@main/public/YunderaPCS-setting_iconV2.svg
  category: pcs
  developer: Yundera Team
  # This stack IS the PCS — mesh-router, dex, authelia, the admin app. `system`
  # puts its tile in Maison's System grid and, the part that matters, makes
  # Maison refuse to stop or uninstall it and the nightly backup skip it. It
  # replaces the maison stack's PROTECTED_APPS env, removed at Maison 1.1.5;
  # an older image ignores the key entirely, so the guard travels with the pin
  # in stacks/maison/docker-compose.yml. Restart is still offered.
  #
  # It is read from the MIRROR at /DATA/AppData/yundera (ensure-maison-yundera-
  # mirror.sh copies this file there), which is what makes the tile managed —
  # and managed is exactly what makes a stray Uninstall click reachable.
  view: system
  webui-host: admin-${DOMAIN}
  webui-scheme: https
  webui-path: /
