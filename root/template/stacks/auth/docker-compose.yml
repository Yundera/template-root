# =============================================================================
# AUTH STACK — who someone is, for every app on the box.
#
#   dex             the OIDC broker every app logs in through (auth-${DOMAIN})
#   authelia        the box-local credential, federated by Dex as "Local Account"
#                   (local-auth-${DOMAIN})
#   auth-registrar  OIDC client self-registration: how every AppShield gate on the
#                   box — admin, maison, kopia, terminal, store apps — gets a client
#
# Split out of the yundera stack, and out of mesh-router-template-root's mesh
# stack, so identity is one unit on both templates. Deployed to /DATA/AppData/auth
# by scripts/self-check/ensure-auth-stack.sh through scripts/tools/deploy-stack.sh,
# which also writes the .env beside it from the unified yundera .env. DO NOT edit
# the deployed copy — it is overwritten on every self-check.
#
# THE DATA DID NOT MOVE. Authelia's database and Dex's state still live in
# /DATA/AppData/yundera/auth and /DATA/AppData/yundera/dex, rendered there by
# ensure-authelia.sh and ensure-dex.sh — which is why those two run before this
# stack comes up (scripts-config.txt). Only the compose project changed.
#
# CROSS-STACK, ONE WAY: this stack needs the mesh stack, never the reverse.
#   - Caddy (mesh) routes auth-* and local-auth-* here by container name; the
#     TLS choice and the Dex routing rules are the (dex_router*) snippets in
#     template/caddy/Caddyfile.
#   - Dex reads the mesh CA from data/ca, which mesh-router-agent writes.
#   - Dex's extra_hosts pin terminates on the host's :443, i.e. mesh-router-caddy.
#   - Authelia mails password resets through `smtp`.
# Hence ensure-mesh-stack.sh runs first.
#
# AUTH-CONSOLE (Yundera/auth-console) is this stack's web UI and the tile's target:
# the local accounts (Authelia users), host SSH access and the support key — the
# Account and Access panels that used to live in the admin app. An AppShield gate
# named `auth-console` plus a backend `auth-console-app`, served at
# auth-console-${DOMAIN}. NOT `auth`: Dex owns auth-${DOMAIN}, and the registrar
# derives a gate's client id — and so its callback host — from its container name.
# The console is optional to login: if it is down, every other app still logs in.
# =============================================================================
name: auth

services:
  # =============================================================================
  # DEX - OIDC identity broker for PCS apps (replaces Authelia)
  # Apps delegate login via OIDC authorization_code flow. Endpoints:
  #   https://auth-${DOMAIN}/.well-known/openid-configuration
  # User identity is federated to Authelia (the PCS-local credential store) and,
  # when the box has a Yundera account, to the orchestrator's IdP — see the
  # connectors in dex.config.yaml.tmpl and the tail of ensure-dex.sh. The old
  # CasaOS connector (casaos-oidc-bridge) is gone.
  # App clients are registered dynamically by auth-registrar over
  # Dex's gRPC API — no static client list. Config + sqlite + issued client
  # secrets are provisioned by scripts/self-check/ensure-dex.sh into
  # /DATA/AppData/yundera/dex/.
  # =============================================================================
  dex:
    # PINNED BY DIGEST TO A `master` BUILD, DELIBERATELY — not a release tag.
    #
    # The logout features this PCS depends on are merged upstream but UNRELEASED:
    # RP-Initiated Logout (PR #4674, 2026-04-01) and Back-Channel Logout with a
    # `sid` claim (PR #4945, 2026-07-30). The newest release, v2.45.1
    # (2026-03-03), predates both and advertises no logout of any kind — which is
    # why "log out" could not log anybody out. See SSO-LOGOUT-PLAN.md §10.
    #
    # By DIGEST and not `:master`, because `:master` is a moving tag: every push
    # to trunk would silently reach the whole fleet on the next
    # ensure-user-compose-pulled.sh. This digest is the 2026-08-06 build,
    # verified to advertise end_session_endpoint + backchannel_logout_supported.
    #
    # REPIN TO A RELEASE as soon as one ships with both PRs (expected > v2.45.1).
    # The delta from v2.45.1 is large — trunk restructured server/ into logout/,
    # backchannel/, discovery/, consent/, mfa/ packages — so this is a bigger
    # unreleased surface than "a logout patch" implies.
    image: ghcr.io/dexidp/dex@sha256:af9469509350ff3f6ca70127175a58e5ab085b9d18740fa4a590d9f03f0a026b
    container_name: dex
    hostname: dex
    restart: unless-stopped
    cpu_shares: 80
    command: ["dex", "serve", "/data/config.yaml"]
    environment:
      # Gates the whole `sessions:` block in dex.config.yaml.tmpl. Dex REFUSES TO
      # START with a sessions config and this unset ("sessions config requires
      # sessions to be enabled"), so the two must move together.
      #
      # Turning it on gives Dex a real `dex_session` browser cookie, which is
      # what makes it an OP you can log out of — and what replaces the
      # connector-stickiness rules that used to live in caddy/Caddyfile.
      DEX_SESSIONS_ENABLED: "true"
      # Trust the mesh-router CA *on top of* the image's baked-in roots, for the
      # extra_hosts pin below. Same pair as the AppShield gates: once the Local
      # Account connector's issuer resolves on-box, its back-channel TLS
      # terminates at this PCS's own Caddy, which serves local-auth-${DOMAIN}
      # with the mesh-router CA (`gateway_tls` in caddy/Caddyfile) rather than a
      # publicly-trusted certificate. The public path only ever validated because
      # Cloudflare re-terminated TLS on the way through.
      #
      # SSL_CERT_DIR and NOT SSL_CERT_FILE: Go replaces certDirectories but keeps
      # certFiles, so a directory ADDS roots while SSL_CERT_FILE would REPLACE
      # the image's bundle outright — and Dex still needs the public roots for
      # the "Yundera Login" connector, whose issuer is genuinely off-box.
      #
      # This relies on the image keeping a bundle at one of Go's default
      # certFiles paths. Verified for the digest pinned above:
      # /etc/ssl/certs/ca-certificates.crt, and it is the only file in that
      # directory. RE-VERIFY ON REPIN — an image that ships only a cert
      # directory would lose its public roots here and Yundera Login with them.
      SSL_CERT_DIR: "/ca"
    # KEEP THE CONNECTOR BACK-CHANNEL ON THE BOX — the same hairpin fixed on the
    # AppShield gates (see the `admin` gate in the yundera stack — the root
    # docker-compose.yml — for the full diagnosis).
    # ensure-dex.sh renders the Local Account connector with
    # `issuer: https://local-auth-${DOMAIN}`, and Dex does discovery, the code
    # exchange and the JWKS fetch against that public hostname. Resolved
    # publicly, those server-to-server calls leave the PCS, cross Cloudflare and
    # the mesh-router CF Worker, and re-enter this same machine to reach a
    # container on this bridge — a path observed answering ~70% of requests with
    # an empty body on 2026-09-15.
    #
    # The issuer STRING does not change, so Authelia's discovery document still
    # matches, the browser still resolves local-auth-${DOMAIN} publicly, and
    # every redirect the user sees is unchanged. Only the lookup moves.
    #
    # Plain HTTP is not an alternative: the scheme is part of the issuer, and an
    # OIDC client rejects a discovery document whose `issuer` does not match the
    # URL it fetched.
    extra_hosts:
      - "local-auth-${DOMAIN}:host-gateway"
    volumes:
      # The mesh-router CA that SSL_CERT_DIR above points at — written straight
      # here by mesh-router-agent (CA_CERT_PATH), in its own directory so key.pem
      # never travels with it. A CA certificate is public; the key is not.
      #
      # An EMPTY or missing directory is survivable: Go still loads the image's
      # own bundle, so Dex starts and every publicly-trusted connector keeps
      # working. Only the pinned Local Account connector would fail to open —
      # which is exactly what the probe in ensure-dex.sh prevents from being
      # rendered in the first place.
      - /DATA/AppData/yundera/data/ca:/ca:ro
      # config.yaml (rendered) + dex.db (sqlite). This is CACHE, not precious
      # data — see the recovery note in scripts/self-check/ensure-dex.sh.
      - /DATA/AppData/yundera/dex:/data
      # Custom "yundera" frontend, overlaid onto the stock image (no frontend.dir,
      # so all other stock templates/static stay intact). ensure-dex.sh renders
      # these from the template's dex-theme/ before the stack comes up.
      #
      # These sit UNDER dex/, which the line above already mounts at /data — so
      # the same files are visible twice inside the container, at /data/frontend/
      # and at the two /srv/dex/web/ targets. Deliberate: Docker mounts each
      # source at its own target independently, Dex reads nothing but
      # /data/config.yaml and /data/dex.db, and keeping the rendered theme inside
      # the directory that owns Dex's disposable state means one cache dir at the
      # stack root instead of two. Moved here from the sibling dex-frontend/ on
      # 2026-09-18; migrations/2026-09-18-10-move-dex-frontend-into-dex.sh sweeps
      # the old path.
      - /DATA/AppData/yundera/dex/frontend/templates/login.html:/srv/dex/web/templates/login.html:ro
      - /DATA/AppData/yundera/dex/frontend/templates/header.html:/srv/dex/web/templates/header.html:ro
      - /DATA/AppData/yundera/dex/frontend/themes/yundera:/srv/dex/web/themes/yundera:ro
    expose:
      - "5556"   # OIDC web endpoints (Caddy terminates TLS), bound on pcs
      - "5557"   # gRPC client-mgmt API — UNAUTHENTICATED, bound to yundera-auth IP only
    networks:
      pcs: null
      # gRPC (5557) is bound to `dex-grpc` in config.yaml.tmpl, so it is reachable
      # ONLY by containers on yundera-auth (just auth-registrar).
      #
      # THE ALIAS IS THE WHOLE MECHANISM, and it must stay network-scoped. Dex is
      # multi-homed, so binding to its own container name is ambiguous — Docker's
      # embedded DNS answers from the *querying* container's perspective and can
      # hand back the `pcs`-side address, which would publish an unauthenticated
      # client-minting API to every app on the box. An alias declared here and
      # nowhere else exists in exactly one network's DNS scope, so it has exactly
      # one A record and `net.Listen` can only bind to the yundera-auth interface.
      #
      # This replaced a pinned ipv4_address (172.31.7.2 on a /29). That address was
      # also the first one Docker's IPAM hands out dynamically, so any cycle where
      # auth-registrar attached while Dex was between restarts stole it and wedged
      # Dex forever on "Address already in use" — which is exactly what happened on
      # the 2026-08-27 demostaging2 provision. There is no pinned address left to
      # collide over; do not reintroduce one.
      yundera-auth:
        aliases:
          - dex-grpc
    # No `depends_on` for the connectors: authelia is in this stack but Dex must
    # not block on it, and the Yundera IdP is off-box entirely.
    #
    # WHAT ACTUALLY HAPPENS WHEN A CONNECTOR IS UNREACHABLE AT BOOT — measured
    # against the digest pinned above (v2.46.0-20260806171424) on 2026-09-16,
    # because two different notes in this tree used to claim two wrong things:
    #
    #   * it is NOT retried on use. Every connector is opened once, at startup.
    #   * it is NOT fatal per-connector. This build logs
    #     "continue on connector failure feature flag enabled", drops the
    #     connector that failed and carries on with the rest.
    #
    # Dex exits only when EVERY connector fails ("failed to open all connectors
    # (1/1)"). So a cold boot that races Authelia loses the Local Account button
    # but keeps Yundera Login and the box stays reachable — unless that was the
    # only connector, in which case Dex exits and restart:unless-stopped retries.
    #
    # The cost is that a dropped connector stays dropped until Dex restarts.
    # ensure-dex.sh restarts it on every self-check, so the ceiling is one tick.
    # THE FEATURE FLAG IS AN UNRELEASED-MASTER DEFAULT: re-measure this on the
    # repin to a release, or a single bad connector is back to taking down login.
    # Unlike every other service here, these labels declare ONLY the hostnames:
    # the TLS choice and the upstream live in the (dex_router*) snippets in
    # caddy/Caddyfile. That is where the connector-memory rules are — named
    # matchers, `uri`, and a `handle_response` block, none of which can be
    # expressed as flat caddy-docker-proxy labels. Keep the hostname list here in
    # sync with the three auth-* hostnames; everything else is in the snippet.
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-${DOMAIN}
      caddy_0.import: dex_router_tls
      # nip.io variant for direct access (custom CA)
      caddy_1: auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: dex_router_tls
      # sslip.io variant for direct access (Let's Encrypt)
      caddy_2: auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.import: dex_router


  # =============================================================================
  # AUTHELIA - local-account IdP, federated by Dex as the "Local Account" connector
  # Owns the credential that used to live in CasaOS. Exactly ONE OIDC client
  # (Dex); no dynamic app-client registration (that stays on Dex's gRPC path).
  # Serves its own login UI at local-auth-${DOMAIN} — which carries the built-in
  # "Reset password?" link and drives the email reset flow through the local
  # smtp relay. Config + secrets + users_database.yml are provisioned by
  # scripts/self-check/ensure-authelia.sh into /DATA/AppData/yundera/auth/.
  # =============================================================================
  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    cpu_shares: 80
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset
    volumes:
      # configuration.yml (rendered) + db.sqlite + users_database.yml + secrets.
      # Unlike the dex dir this holds the local account — back it up.
      - /DATA/AppData/yundera/auth:/config
    expose:
      - "9091"
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed). Distinct host from Dex's
      # auth-${DOMAIN}: Dex is the broker, Authelia is the connector behind it.
      caddy_0: local-auth-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9091}}"
      # nip.io variant for direct access (custom CA)
      caddy_1: local-auth-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9091}}"
      # sslip.io variant for direct access (Let's Encrypt)
      caddy_2: local-auth-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9091}}"


  # =============================================================================
  # AUTH-REGISTRAR - OIDC client self-registration for PCS apps
  # Sidecars (e.g. nginx-hash-lock) POST their redirect URIs to
  #   http://auth-registrar:9092/register
  # on first login and get back {client_id, client_secret, issuer_url}. Caller
  # identity is derived from the source IP via PTR lookup on the pcs network —
  # client_id is never accepted as input. Intentionally NOT publicly routable.
  # In Dex mode it calls Dex's gRPC CreateClient.
  #
  # STATELESS: the registrar's client-secret cache lives inside the container
  # (DEX_CLIENTS_DIR=/tmp/dex-clients) and is deliberately NOT bind-mounted to the
  # data volume — there is no per-client secret to back up. Within a container
  # lifetime the cache makes re-registration idempotent (same secret); after a
  # restart the cache is empty and the registrar transparently rotates each
  # client's secret on its next /register. Apps re-register on every login, so
  # this is invisible. See: packages/mesh-router-root/mesh-router-auth/README.md
  # =============================================================================
  auth-registrar:
    image: ghcr.io/yundera/mesh-auth:1.1.6
    container_name: auth-registrar
    hostname: auth-registrar
    restart: unless-stopped
    cpu_shares: 40
    environment:
      ISSUER_URL: https://auth-${DOMAIN}
      REGISTRAR_BACKEND: dex
      # Dex gRPC is reachable only on the isolated yundera-auth net, under the
      # network-scoped alias Dex binds to. Resolving `dex` instead would be a bug:
      # both containers are on `pcs` too, so that name can resolve to the pcs-side
      # address, where nothing is listening.
      DEX_GRPC_ADDR: dex-grpc:5557
      # ephemeral in-container cache (NOT persisted) — see note above
      DEX_CLIENTS_DIR: /tmp/dex-clients
      # Allowed redirect-URI host suffixes (comma-separated). An app's permitted
      # hosts are <app>-<suffix> for each; the registrar verifies every requested
      # callback against this exact set. Must list the SAME suffixes the apps'
      # caddy_* labels use — the user domain plus the IP-based fallbacks.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      # The one app allowed to register callbacks on the BARE suffixes
      # (${DOMAIN} itself, not just <app>-${DOMAIN}) — i.e. whoever the root
      # domain reverse-proxies to in template/caddy/Caddyfile.
      #
      # Deliberately the SAME variable that drives that Caddy block: "the app
      # that owns the bare hostname" and "the app the bare hostname routes to"
      # are then one fact rather than two settings that can drift. The Domain
      # panel writes it to .pcs.env and triggers a self-check, so this container
      # is recreated on the same tick the root route repoints.
      #
      # It is a proxy upstream target, not an identity: `host.docker.internal`
      # is legal here and is not a container name. The registrar validates it
      # and falls back to "nobody owns the bare hosts" rather than guessing —
      # check the `root app:` line in `docker logs auth-registrar` if a login on
      # the bare domain still lands on <app>-${DOMAIN}.
      #
      # Needs mesh-auth >= 1.1.4; older images ignore this and apps keep the
      # pre-existing bounce-to-<app>-${DOMAIN} behaviour.
      ROOT_CLIENT_ID: "${DEFAULT_SERVICE_HOST}"
    expose:
      - "9092"
    networks:
      pcs: null            # /register from app sidecars + PTR attestation
      yundera-auth: null   # gRPC to Dex (no fixed address needed — dials the alias)
    depends_on:
      - dex

  # =============================================================================
  # AUTH-CONSOLE — this stack's web UI (Yundera/auth-console): Account (the local
  # Authelia users) and Access (host accounts, SSH keys, login history, support
  # key). Replaces the admin app's Account and Access panels.
  #
  # SECURITY: auth-console-app holds the Docker socket (it runs its host actions
  # as a one-shot privileged `auth-console-runner` in the host's namespaces), so it
  # is root-equivalent on the host. It is reachable only through its gate: NEVER
  # add `ports:` or caddy labels to it. The app trusts only the HS256
  # X-AppShield-Assertion the gate signs with AUTH_CONSOLE_ASSERTION_SECRET —
  # every container on `pcs` can reach it directly, so plain X-Auth-* / Remote-*
  # headers prove nothing — and checks the admin group per route itself.
  #
  # NO OIDC_REQUIRED_GROUPS, like the admin gate: a non-admin account must reach
  # its own Account page. The admin-only routes answer 403 in the app.
  #
  # NAMES ARE LOAD-BEARING: the registrar derives the gate's client_id from its
  # container name, and the gate's APP_NAME is the assertion audience — so the
  # gate owns `auth-console` and the backend takes `-app`.
  #
  # AUTH_CONSOLE_ASSERTION_SECRET is minted by ensure-auth-stack.sh (ensure_secret,
  # .pcs.secret.env) right before the deploy; deleting it re-mints it and only
  # logs everyone out of this console.
  # =============================================================================
  auth-console:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: auth-console
    hostname: auth-console
    restart: unless-stopped
    # Same uid as the admin gate. ensure-auth-stack.sh chowns gate-data to it: the
    # gate writes sessions.json through a temp file, so it needs the DIR writable.
    user: "65534:65534"
    cpu_shares: 40
    mem_limit: 128m
    expose:
      - "80"
    environment:
      APP_NAME: "auth-console"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Fallback only — the registrar's own REDIRECT_HOST_SUFFIXES decides. Keep it
      # matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "auth-console-app"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      # Signs the identity assertion for auth-console-app, and verifies the control
      # tokens it sends back (POST /nhl-auth/sessions/revoke when an account is
      # deleted or its password reset).
      IDENTITY_ASSERTION_SECRET: ${AUTH_CONSOLE_ASSERTION_SECRET}
      # The only path that answers without a login: a liveness probe, no data.
      ALLOWED_PATHS: "api/health"
      # The mesh-router CA, for the back-channel pinned below — same pair as every
      # AppShield gate on a PCS (see the admin gate in the yundera stack).
      SSL_CERT_DIR: "/ca"
    # Keep the OIDC back-channel on this box instead of a round trip through
    # Cloudflare and the CF Worker (see the admin gate for the diagnosis).
    extra_hosts:
      - "auth-${DOMAIN}:host-gateway"
    volumes:
      - /DATA/AppData/auth/auth-console/gate-data:/data
      - /DATA/AppData/yundera/data/ca:/ca:ro
    depends_on:
      - auth-console-app
      - auth-registrar
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: auth-console-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: auth-console-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: auth-console-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  auth-console-app:
    # Publish the tag before moving this pin: a tag missing from ghcr costs every
    # self-check the pull backoff.
    image: ghcr.io/yundera/auth-console:1.1.0
    container_name: auth-console-app
    hostname: auth-console-app
    restart: unless-stopped
    # Root: it reads the unified .env (mode 600) and talks to the Docker socket,
    # which already makes it root-equivalent on the host.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      IDENTITY_ASSERTION_SECRET: ${AUTH_CONSOLE_ASSERTION_SECRET}
      IDENTITY_ASSERTION_AUDIENCE: "auth-console"
      APPSHIELD_GATE_URL: "http://auth-console"
      # The yundera root as the HOST sees it. Host actions run in the host's mount
      # namespace, so they need these paths, not the /host-root mount below.
      HOST_ROOT: "/DATA/AppData/yundera"
      HOST_SCRIPTS: "/DATA/AppData/yundera/template/scripts"
      # Enables the support-key tag and toggle on the Access page.
      OPERATOR_API: ${OPERATOR_API}
      # SSH-key deep links fetched from these hosts are shown as "trusted".
      TRUSTED_PUBKEY_HOST_SUFFIXES: "yundera.com"
    expose:
      - "8080"   # NEVER `ports:` — see the security note above
    networks:
      pcs: null
    volumes:
      # Read-only: the unified .env (DOMAIN, LOCAL_ADMIN_USER) and which scripts
      # exist. Every write goes through a host action, never through this mount.
      - /DATA/AppData/yundera:/host-root:ro
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  # Shared by every stack and owned by none — see the mesh stack.
  pcs:
    name: pcs
    external: true
  # Isolated gRPC-only net for the auth-registrar <-> Dex client-management API.
  # internal: true → no egress (Dex's egress comes from the pcs network it is also
  # on). App containers live only on pcs, so they cannot reach Dex's gRPC port
  # (5557), which is bound to the `dex-grpc` alias on this net.
  #
  # NO ipam BLOCK, DELIBERATELY. Addressing here is entirely dynamic: Dex is found
  # by its network-scoped alias, not by a pinned address, so there is no reserved
  # IP for the dynamic allocator to collide with and no subnet to keep clear of
  # other host docker networks. See the alias note on the dex service.
  #
  # THE NAME IS NAMESPACED ON PURPOSE. The security property of this network is
  # "only auth-registrar is on it", on a box where the owner installs arbitrary
  # store apps. A generic top-level name (`auth`) is claimable by any third-party
  # compose file with `name:` or `external: true`, and the prize for landing here
  # is unauthenticated OIDC-client minting. Renamed from `dex-internal`;
  # migrations/2026-08-27-10-rename-dex-internal-network.sh drops the old one.
  yundera-auth:
    name: yundera-auth
    internal: true

# Tiles the stack in Maison's System grid: Maison refuses to stop or uninstall it
# (every login on the box goes through it) and the nightly backup skips it — as it
# did when these services were in the yundera stack. The tile opens auth-console;
# webui-host is the only field Maison substitutes ${DOMAIN} into, and it must
