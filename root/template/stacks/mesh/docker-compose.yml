# =============================================================================
# MESH STACK — the nsl.sh services: how this box is reached, and how it mails.
#
#   mesh-router-tunnel  WireGuard to the provider, for boxes behind NAT
#   mesh-router-agent   registers the public IP for direct routing; writes the
#                       mesh certificate (data/certs) and the mesh CA (data/ca)
#   mesh-router-caddy   the box's reverse proxy: every public hostname, :80/:443
#   smtp                mail relay through the mesh-router-backend (PROVIDER_STR)
#
# Split out of the yundera stack to match mesh-router-template-root, whose `mesh`
# stack carries the same four. Deployed to /DATA/AppData/mesh by
# scripts/self-check/ensure-mesh-stack.sh through scripts/tools/deploy-stack.sh,
# which also writes the .env beside it from the unified yundera .env. DO NOT edit
# the deployed copy — it is overwritten on every self-check.
#
# THE DATA DID NOT MOVE. Every bind below still points into /DATA/AppData/yundera
# (data/certs, data/ca, data/caddy, template/caddy), exactly as when these services
# lived in the root compose: only the compose project changed. Moving the state is
# a separate migration, if it is ever worth one.
#
# CONTAINER NAMES ARE LOAD-BEARING and did not change either: the auth stack, the
# gates and the Caddyfile all reach these by name on `pcs`, and deploy-stack.sh's
# squatter eviction is what hands them over from the yundera project on the tick
# this file first ships (library/stacks.sh).
#
# `PROVIDER_STR` is read by exactly three services on the box, and all three are
# here — see doc/stack-split.md, `nsl-provider`.
# =============================================================================
name: mesh

services:
  # =============================================================================
  # MESH ROUTER TUNNEL (v2)
  # Establishes WireGuard VPN tunnel to the provider for NAT traversal
  # =============================================================================
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.3.0
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cpu_shares: 90
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  
  # =============================================================================
  # MESH ROUTER AGENT (v2)
  # Registers public IP with backend for direct routing (bypasses VPN)
  # =============================================================================
  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.1.1
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    cpu_shares: 90
    environment:
      - PROVIDER=${PROVIDER_STR}
      # Must stay in sync with Caddy's ${PUBLIC_IP_DASH}-based labels — registering
      # any other family here causes the CF Worker to rewrite Host to a hostname
      # Caddy doesn't know, and every subdomain falls into the catch-all.
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
      # THE CA GOES IN ITS OWN DIRECTORY, AWAY FROM THE KEY. The agent writes three
      # files: key.pem, cert.pem and the mesh-router CA. Caddy needs the first two
      # and nothing on the box reads the third — but the AppShield gates do, because
      # they resolve auth-${DOMAIN} on-box (see the extra_hosts block on the `admin`
      # gate in the yundera stack) and that TLS terminates at Caddy's mesh-CA
      # certificate.
      #
      # A CA certificate is public — Caddy hands it to every client in the
      # handshake. key.pem is not, and mounting one directory into the gates would
      # mean mounting both. Splitting them at the writer costs one env var and one
      # mount here, and is why no self-check script has to copy anything.
      - CA_CERT_PATH=/app/ca/ca-cert.pem
    volumes:
      - /DATA/AppData/yundera/data/certs:/app/data
      # Read-write: this is where the agent WRITES the CA, per CA_CERT_PATH above.
      #
      # ensure-pcs-user.sh declares this directory alongside data/certs, but do
      # NOT rely on it existing first: that script is #1 in scripts-config.txt
      # and ensure-template-sync.sh is #5, so on the tick that INTRODUCES a new
      # directory the pre-create always runs a tick before the template that
      # needs it. Docker then invents it root-owned and the next tick's
      # `chown -R pcs:pcs` tidies up (observed on wisera 2026-09-16).
      #
      # That is survivable here only because mesh-router-agent runs as uid 0
      # (verified in the 1.1.1 image, not assumed) and can write into a
      # root-owned directory. A future container that needs a pre-created,
      # correctly-owned mount and does NOT run as root will fail on the tick it
      # is introduced. Fix the ordering before relying on the pre-create.
      - /DATA/AppData/yundera/data/ca:/app/ca
    networks:
      pcs: null

  
  # =============================================================================
  # MESH ROUTER CADDY (v2)
  # Reverse proxy with Docker container discovery via labels
  # =============================================================================
  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.6
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    cpu_shares: 90
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A DIRECTORY, not the Caddyfile itself. A single-file bind mount is pinned
      # to the inode it started with, and ensure-template-sync.sh updates the
      # template with rsync — which renames a new file into place. Mounted as a
      # file, this container would keep serving the Caddyfile it booted with,
      # silently and forever: caddy-docker-proxy re-reads the path on every
      # generation, so the config always looked freshly built. Observed in the
      # field as an eight-week-old Caddyfile behind a correct-looking config.
      # The dir also cannot be the app root — .pcs.secret.env lives there.
      - /DATA/AppData/yundera/template/caddy:/etc/caddy:ro
      - /DATA/AppData/yundera/data/certs:/certs:ro
      - /DATA/AppData/yundera/data/caddy/data:/data
      - /DATA/AppData/yundera/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=admin@${DOMAIN}
      # Root domain routing configuration
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.1.0
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    cpu_shares: 70
    environment:
      # Provider mode: route mail through the mesh-router-backend that owns this PCS's domain
      # (same as the nsl path), sending from <app>.<user-domain>@<server-domain>. The gateway
      # derives the endpoint + credential from PROVIDER_STR — no orchestrator email API.
      RELAY_CREDENTIAL: "${PROVIDER_STR}"
      SMTP_PORT: "587"
    expose:
      - "587"
    volumes:
      # Delivery stats for the Email page of Mesh Console (mail-gateway >= 1.1.0).
      - smtp-data:/data
    networks:
      pcs: null

networks:
  # Shared by every stack and owned by none — created by ensure_pcs_network
  # (library/stacks.sh) before any stack comes up. See the note in the root
  # docker-compose.yml.
  pcs:
    name: pcs
    external: true

volumes:
  smtp-data:

# Tiles the stack in Maison's System grid: Maison refuses to stop or uninstall it
# (uninstalling it would take every route on the box down) and the nightly backup
# skips it. No web UI of its own yet — the Domain panel of the admin app is where
# its settings live — so no webui-* fields.
x-compose-app:
  schema_version: 2
  id: mesh
  title: Mesh Router
  category: pcs
  developer: Yundera Team
  view: system
