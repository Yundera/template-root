# =============================================================================
# MESH STACK — the nsl.sh services: how this box is reached, and how it mails.
#
#   mesh-router-tunnel  WireGuard to the provider, for boxes behind NAT
#   mesh-router-agent   registers the public IP for direct routing; writes the
#                       mesh certificate (data/certs) and the mesh CA (data/ca)
#   mesh-router-caddy   the box's reverse proxy: every public hostname, :80/:443
#   smtp                mail relay through the mesh-router-backend (PROVIDER_STR)
#   mesh-console(-app)  the stack's web UI, behind its AppShield gate
#
# Split out of the yundera stack to match mesh-router-template-root, whose `mesh`
# stack carries the same services. Deployed to /DATA/AppData/mesh by
# scripts/self-check/ensure-mesh-stack.sh through scripts/tools/deploy-stack.sh,
# which also writes the .env beside it from the unified yundera .env. DO NOT edit
# the deployed copy — it is overwritten on every self-check.
#
# THE STATE IS IN THIS STACK'S FOLDER: /DATA/AppData/mesh/data/{certs,ca,caddy},
# the same relative layout as the mesh template. Until 2026-10-01 it sat in the
# yundera root (data/); a migration renames it across on a box that still has it
# there, before this file is delivered
# (scripts/migrations/2026-10-01-10-move-state-into-stack-folders.sh). The one bind that
# still points into the yundera root is template/caddy — the Caddyfile is part of
# the synced template tree, not state.
#
# CONTAINER NAMES ARE LOAD-BEARING and did not change either: the auth stack, the
# gates and the Caddyfile all reach these by name on `pcs`, and deploy-stack.sh's
# squatter eviction is what hands them over from the yundera project on the tick
# this file first ships (library/stacks.sh).
#
# `PROVIDER_STR` is read by exactly three services on the box, and all three are
# here — see doc/stack-split.md, `nsl-provider`.
# =============================================================================
name: mesh

services:
  # =============================================================================
  # MESH ROUTER TUNNEL (v2)
  # Establishes WireGuard VPN tunnel to the provider for NAT traversal
  # =============================================================================
  mesh-router-tunnel:
    image: ghcr.io/yundera/mesh-router-tunnel:1.3.0
    container_name: mesh-router-tunnel
    hostname: mesh-router-tunnel
    restart: unless-stopped
    cpu_shares: 90
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      - PROVIDER=${PROVIDER_STR}
      - ROUTING_TARGET_HOST=mesh-router-caddy
      # Dual-port support for transparent HTTP/HTTPS routing
      - ROUTING_TARGET_PORT_HTTPS=443
      - ROUTING_TARGET_PORT_HTTP=80
    networks:
      pcs: null
    depends_on:
      - mesh-router-caddy

  
  # =============================================================================
  # MESH ROUTER AGENT (v2)
  # Registers public IP with backend for direct routing (bypasses VPN)
  # =============================================================================
  mesh-router-agent:
    image: ghcr.io/yundera/mesh-router-agent:1.1.1
    container_name: mesh-router-agent
    hostname: mesh-router-agent
    restart: unless-stopped
    cpu_shares: 90
    environment:
      - PROVIDER=${PROVIDER_STR}
      # Must stay in sync with Caddy's ${PUBLIC_IP_DASH}-based labels — registering
      # any other family here causes the CF Worker to rewrite Host to a hostname
      # Caddy doesn't know, and every subdomain falls into the catch-all.
      - PUBLIC_IP=${PUBLIC_IP}
      # Dual-port support for transparent HTTP/HTTPS routing
      - TARGET_PORT_HTTPS=443
      - TARGET_PORT_HTTP=80
      # THE CA GOES IN ITS OWN DIRECTORY, AWAY FROM THE KEY. The agent writes three
      # files: key.pem, cert.pem and the mesh-router CA. Caddy needs the first two
      # and nothing on the box reads the third — but the AppShield gates do, because
      # they resolve auth-${DOMAIN} on-box (see the extra_hosts block on the `admin`
      # gate in the yundera stack) and that TLS terminates at Caddy's mesh-CA
      # certificate.
      #
      # A CA certificate is public — Caddy hands it to every client in the
      # handshake. key.pem is not, and mounting one directory into the gates would
      # mean mounting both. Splitting them at the writer costs one env var and one
      # mount here, and is why no self-check script has to copy anything.
      - CA_CERT_PATH=/app/ca/ca-cert.pem
    volumes:
      - /DATA/AppData/mesh/data/certs:/app/data
      # Read-write: this is where the agent WRITES the CA, per CA_CERT_PATH above.
      #
      # ensure-pcs-user.sh declares this directory alongside data/certs, but do
      # NOT rely on it existing first: that script is #1 in scripts-config.txt
      # and ensure-template-sync.sh is #5, so on the tick that INTRODUCES a new
      # directory the pre-create always runs a tick before the template that
      # needs it. Docker then invents it root-owned and the next tick's
      # `chown -R pcs:pcs` tidies up (observed on wisera 2026-09-16).
      #
      # That is survivable here only because mesh-router-agent runs as uid 0
      # (verified in the 1.1.1 image, not assumed) and can write into a
      # root-owned directory. A future container that needs a pre-created,
      # correctly-owned mount and does NOT run as root will fail on the tick it
      # is introduced. Fix the ordering before relying on the pre-create.
      - /DATA/AppData/mesh/data/ca:/app/ca
    networks:
      pcs: null

  
  # =============================================================================
  # MESH ROUTER CADDY (v2)
  # Reverse proxy with Docker container discovery via labels
  # =============================================================================
  mesh-router-caddy:
    image: ghcr.io/yundera/mesh-router-caddy:1.2.6
    container_name: mesh-router-caddy
    hostname: mesh-router-caddy
    restart: unless-stopped
    cpu_shares: 90
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A DIRECTORY, not the Caddyfile itself. A single-file bind mount is pinned
      # to the inode it started with, and ensure-template-sync.sh updates the
      # template with rsync — which renames a new file into place. Mounted as a
      # file, this container would keep serving the Caddyfile it booted with,
      # silently and forever: caddy-docker-proxy re-reads the path on every
      # generation, so the config always looked freshly built. Observed in the
      # field as an eight-week-old Caddyfile behind a correct-looking config.
      # The dir also cannot be the app root — .pcs.secret.env lives there.
      - /DATA/AppData/yundera/template/caddy:/etc/caddy:ro
      - /DATA/AppData/mesh/data/certs:/certs:ro
      - /DATA/AppData/mesh/data/caddy/data:/data
      - /DATA/AppData/mesh/data/caddy/config:/config
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=pcs
      - PCS_EMAIL=admin@${DOMAIN}
      # Root domain routing configuration
      - DOMAIN=${DOMAIN}
      - PUBLIC_IP_DASH=${PUBLIC_IP_DASH}
      - DEFAULT_SERVICE_HOST=${DEFAULT_SERVICE_HOST}
      - DEFAULT_SERVICE_PORT=${DEFAULT_SERVICE_PORT}
    networks:
      pcs: null
    depends_on:
      - mesh-router-agent

  smtp:
    image: ghcr.io/yundera/mail-gateway:1.1.0
    container_name: smtp
    hostname: smtp
    restart: unless-stopped
    cpu_shares: 70
    environment:
      # Provider mode: route mail through the mesh-router-backend that owns this PCS's domain
      # (same as the nsl path), sending from <app>.<user-domain>@<server-domain>. The gateway
      # derives the endpoint + credential from PROVIDER_STR — no orchestrator email API.
      RELAY_CREDENTIAL: "${PROVIDER_STR}"
      SMTP_PORT: "587"
    expose:
      - "587"
    volumes:
      # Delivery stats for the Email page of Mesh Console (mail-gateway >= 1.1.0).
      - smtp-data:/data
    networks:
      pcs: null

  # =============================================================================
  # MESH CONSOLE - the stack's web UI (github.com/Yundera/mesh-console)
  # IP and domain, how the gateways route to this box (direct / tunnel /
  # offline), mail delivery, and whether the template is up to date with an
  # "Update now" that runs the self-check. It is what the Mesh Router tile opens
  # (x-compose-app below), so it lives in this stack rather than in a project of
  # its own — the same two services as mesh-router-template-root's mesh stack;
  # only the mesh-console-app paths below differ, for this template's layout.
  #
  # SECURITY — read before changing either service:
  #   - mesh-console-app holds the Docker socket, i.e. root on this host, and
  #     uses it to run a small fixed set of host actions. The AppShield gate is
  #     the ONLY route in. Never add a `ports:` mapping to either service.
  #   - Admins only, enforced twice: the gate refuses any account outside
  #     `admins` (OIDC_REQUIRED_GROUPS), and the app independently verifies the
  #     gate's signed identity assertion (IDENTITY_ASSERTION_SECRET) and the group
  #     again. The app cannot trust plain headers: every app container on `pcs`
  #     can reach it.
  #
  # MESH_CONSOLE_ASSERTION_SECRET is minted by ensure-mesh-stack.sh right before
  # this stack comes up. Unset, the app refuses every request — it fails closed.
  #
  # NAMING IS LOAD-BEARING, exactly as for the maison stack: the auth-registrar
  # derives the OIDC client_id from a PTR lookup of the calling container's name
  # and only issues redirect URIs under `<client_id>-<suffix>`, so the gate owns
  # the public name `mesh-console` and the backend takes the `-app` suffix.
  # AppShield also derives the assertion audience (APP_NAME) from this hostname,
  # which is why the app verifies aud=mesh-console.
  # =============================================================================
  mesh-console:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: mesh-console
    hostname: mesh-console
    restart: unless-stopped
    # Root, like the maison gate: the gate-data dir is created by Docker as root,
    # and a non-root gate silently fails to persist sessions there.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    expose:
      - "80"
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      # Fallback only — the registrar's own REDIRECT_HOST_SUFFIXES decides. Keep it
      # matching the caddy_* labels below.
      REDIRECT_HOST_SUFFIXES: "${DOMAIN},${PUBLIC_IP_DASH}.nip.io,${PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "mesh-console-app"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      SESSION_DURATION_HOURS: "720"
      # Everything on this page is an admin action, so unlike admin-app (which
      # lets a non-admin reach its Account panel) the group is enforced at the gate.
      OIDC_REQUIRED_GROUPS: "admins"
      # Shared with mesh-console-app, which verifies the X-AppShield-Assertion the
      # gate signs with it.
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      # The only path that answers without a login: a liveness probe, no data.
      ALLOWED_PATHS: "api/health"
      # The on-box OIDC back-channel, as on every gate here: trust the mesh CA
      # on top of the image's roots, for the extra_hosts pin below. Full write-up
      # on the `admin` gate in the yundera stack; keep the three in step.
      SSL_CERT_DIR: "/ca"
    extra_hosts:
      - "auth-${DOMAIN}:host-gateway"
    volumes:
      # Inside this stack's own folder — deploy-stack.sh only ever writes
      # docker-compose.yml and .env there.
      - /DATA/AppData/mesh/mesh-console/gate-data:/data
      - /DATA/AppData/mesh/data/ca:/ca:ro
    # Not auth-registrar: it is in the auth stack, and depends_on cannot name
    # another project's service. Nothing is lost — the gate registers on first
    # login, not at start, and retries then.
    depends_on:
      - mesh-console-app
    networks:
      pcs: null
    labels:
      # Standard domain with custom CA (gateway-routed)
      caddy_0: mesh-console-${DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # nip.io variant (custom CA) — REQUIRED: the CF worker rewrites Host to nip.io
      caddy_1: mesh-console-${PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # sslip.io variant (Let's Encrypt)
      caddy_2: mesh-console-${PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

  mesh-console-app:
    image: ghcr.io/yundera/mesh-console:1.2.0
    container_name: mesh-console-app
    hostname: mesh-console-app
    restart: unless-stopped
    # Root: it reads this stack's .env (mode 600) and talks to the Docker socket.
    # The socket already makes it root-equivalent on the host.
    user: "0:0"
    cpu_shares: 40
    mem_limit: 128m
    environment:
      IDENTITY_ASSERTION_SECRET: "${MESH_CONSOLE_ASSERTION_SECRET}"
      IDENTITY_ASSERTION_AUDIENCE: "mesh-console"
      # THIS TEMPLATE'S LAYOUT, which is not the mesh template's. The console
      # assumes one directory holding the stack's compose, its .env, the
      # self-check log, the certs and template/.revision.json. Here the mesh
      # stack's folder has the first two and the certs; the template tree and the
      # log belong to the yundera root and are mounted in (see the mounts below).
      #
      # Host actions run in the host's mount namespace, so these are HOST paths.
      # MESH_HOST_ROOT is only what TEMPLATE_SCRIPTS is taken relative to
      # (template/scripts), to find the tools under the /mesh mount.
      MESH_HOST_ROOT: "/DATA/AppData/yundera"
      # The template's scripts: the console runs self-check.sh and
      # tools/set-default-app.sh from here and knows nothing else about this
      # layout — where the default app is stored (.pcs.env) and what applying it
      # recreates is that tool's business. VERSION-COUPLED: mesh-console >= 1.2.0.
      TEMPLATE_SCRIPTS: "/DATA/AppData/yundera/template/scripts"
      LOG_FILE: "/yundera-log/yundera.log"
      # The compose projects listed as platform containers.
      PLATFORM_PROJECTS: "mesh,auth,yundera,maison,kopia,terminal"
    expose:
      - "8080"   # NEVER `ports:` — see the security note above
    networks:
      pcs: null
    volumes:
      # Read-only, and THIS STACK'S FOLDER ONLY — not the yundera root, which also
      # holds the provisioning secrets and the admin gate's sessions. Read through
      # it: .env, docker-compose.yml (the Stack page's image pins) and
      # data/certs/cert.pem. Every write goes through a host action, never
      # through this mount.
      #
      # A DIRECTORY, because .env is replaced by rename and a file mount would
      # stay on the old inode.
      - /DATA/AppData/mesh:/mesh:ro
      # The template tree (scripts and .revision.json; no state, no secrets).
      # Nested in a read-only mount, so its mountpoint has to exist already:
      # ensure-mesh-stack.sh creates /DATA/AppData/mesh/template.
      - /DATA/AppData/yundera/template:/mesh/template:ro
      # The self-check log, for LOG_FILE above.
      - /DATA/AppData/yundera/log:/yundera-log:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The self-check log is written in host local time and the console parses
      # it in time.Local.
      - /etc/localtime:/etc/localtime:ro

networks:
  # Shared by every stack and owned by none — created by ensure_pcs_network
  # (library/stacks.sh) before any stack comes up. See the note in the root
  # docker-compose.yml.
  pcs:
    name: pcs
    external: true

volumes:
  smtp-data:

# Tiles the stack in Maison's System grid: Maison refuses to stop or uninstall it
# (uninstalling it would take every route on the box down) and the nightly backup
# skips it. The tile opens Mesh Console through its gate — the only
# authenticated way in. `webui-host` is the only field Maison substitutes
# ${DOMAIN} into; it must match the mesh-console service's caddy_0.
x-compose-app:
  schema_version: 2
  id: mesh
  title: Mesh Router
  category: pcs
  developer: Yundera Team
  view: system
  webui-host: mesh-console-${DOMAIN}
  webui-scheme: https
  webui-path: /
